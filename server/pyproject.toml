[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "byk-slide"
version = "2026.6.27"
description = "controlling PPT slides from a mobile browser."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "byksdk>=0.1.0,<1.0.0",
    "click>=8.0.0",
    "flask>=2.0",
    "pyperclip>=1.9.0,<2.0.0",
    "flask-socketio==5.3.3",
    "python-socketio==5.9.0",
    "pyautogui>=0.9.50,<1.0.0",
    "psutil>=5.9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = { find = { where = ["src"], include = ["bykslide*"] } }

[tool.setuptools.package-data]
bykslide = ["dist/**/*"]
